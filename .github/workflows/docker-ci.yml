name: Docker CI

# This fork's own image line. The image name comes from the repository at
# run time (owner lowercased, since ghcr rejects the uppercase owner that
# GITHUB_REPOSITORY_OWNER carries), so nothing here is written by hand.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    # native arm runner instead of QEMU
    runs-on: >-
      ${{ startsWith(matrix.platform, 'linux/arm')
      && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Name the image from the repository
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY#*/}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG=edge
          fi
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          push: true
          build-args: >-
            VERSION=${{ startsWith(github.ref, 'refs/tags/v')
            && github.ref_name || github.sha }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
